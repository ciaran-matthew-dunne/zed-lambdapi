name = "Lambdapi"
grammar = "lambdapi"
path_suffixes = ["lp"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
tab_size = 2
hard_tabs = false

# Brackets for auto-closing and matching.
# Auto-closing is disabled inside strings and comments via `not_in`,
# which references the scopes captured in overrides.scm.
brackets = [
  { start = "(", end = ")", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "[", end = "]", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "{", end = "}", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "/*", end = "*/", close = true, newline = true, not_in = ["string", "comment"] },
  # After typing "{" Zed already auto-closes "}", so typing "|" completes the
  # escaped-identifier delimiter to "{||}" (same trick as the OCaml extension
  # uses for its quoted-string syntax).
  { start = "{|", end = "|", close = true, newline = true, not_in = ["string", "comment"] },
]

# Word characters include special symbols used in identifiers
word_characters = ["_", "$", "?", "@"]
