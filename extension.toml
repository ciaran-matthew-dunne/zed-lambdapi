id = "lambdapi"
name = "Lambdapi"
version = "0.0.1"
schema_version = 1
authors = ["Ciarán Dunne <cciaranddunne@gmail.com>"]
description = "Support for the Lambdapi proof assistant"
repository = "https://github.com/Deducteam/lambdapi"

[grammars.lambdapi]
repository = "https://github.com/ciaran-matthew-dunne/tree-sitter-lambdapi"
rev = "f40b05ca2700605bcb9a50c9deae756c65f47401"
